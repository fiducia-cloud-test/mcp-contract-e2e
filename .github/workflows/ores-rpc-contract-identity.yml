name: ores rpc contract identity certification

on:
  push:
    branches:
      - test/ores-rpc-contract-identity
    paths:
      - ".github/workflows/ores-rpc-contract-identity.yml"
      - "tests/ores-rpc-contract-identity/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out certification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Certify normalized RPC identity and fail-closed admission
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path tests/ores-rpc-contract-identity/Cargo.toml
          cargo fmt --manifest-path tests/ores-rpc-contract-identity/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tests/ores-rpc-contract-identity/Cargo.toml -- -D warnings
          cargo run --locked --manifest-path tests/ores-rpc-contract-identity/Cargo.toml
