name: source pin drift

on:
  pull_request:
    paths:
      - ".github/workflows/source-pin-drift.yml"
      - "README.md"
      - "scripts/test-source-pin-drift.mjs"
      - "scripts/validate-plan.mjs"
      - "scripts/validate-source-pin-drift.mjs"
      - "source-pins.json"
      - "test-plan.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-pin-drift.yml"
      - "README.md"
      - "scripts/test-source-pin-drift.mjs"
      - "scripts/validate-plan.mjs"
      - "scripts/validate-source-pin-drift.mjs"
      - "source-pins.json"
      - "test-plan.json"
  schedule:
    - cron: "53 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Validate the generated harness contract
        run: node scripts/validate-plan.mjs

      - name: Resolve the public MCP source head without credentials
        id: source
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote https://github.com/fiducia-cloud/fiducia-mcp-server.rs.git refs/heads/main | cut -f1)"
          [[ "${remote_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=${remote_sha}" >> "${GITHUB_OUTPUT}"

      - name: Run hostile source-pin mutations
        env:
          MCP_REMOTE_SHA: ${{ steps.source.outputs.sha }}
        run: node --test scripts/test-source-pin-drift.mjs

      - name: Verify all source-pin documents against current main
        env:
          MCP_REMOTE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_PIN_EVIDENCE: test-results/source-pin-drift-evidence.json
        run: node scripts/validate-source-pin-drift.mjs .

      - name: Upload metadata-only pin evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fiducia-mcp-source-pin-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/source-pin-drift-evidence.json
          if-no-files-found: error
          retention-days: 14
